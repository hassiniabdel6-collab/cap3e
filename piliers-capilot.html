<style>
:root{
  --bg:#080C14;--bg2:#0E1420;--bg3:#151C2E;
  --surface:#1A2236;--surface2:#212B40;
  --blue:#3B7EF8;--blue-l:rgba(59,126,248,0.12);--blue-m:rgba(59,126,248,0.25);
  --teal:#0FD6A0;--teal-l:rgba(15,214,160,0.12);
  --amber:#F59E0B;--amber-l:rgba(245,158,11,0.12);
  --purple:#A78BFA;--purple-l:rgba(167,139,250,0.12);
  --red:#F43F5E;--red-l:rgba(244,63,94,0.12);
  --green:#10B981;--green-l:rgba(16,185,129,0.12);
  --text:#F0F2F8;--text2:#8892A8;--text3:#4A5568;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.12);
  --r:14px;--rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;min-height:100vh}

/* HEADER */
.header{padding:2.5rem 1.5rem 2rem;text-align:center;position:relative;overflow:hidden;border-bottom:0.5px solid var(--border)}
.header::before{content:'';position:absolute;top:-60px;right:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(59,126,248,0.1),transparent 70%)}
.header::after{content:'';position:absolute;bottom:-40px;left:-20px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(167,139,250,0.08),transparent 70%)}
.header-inner{max-width:760px;margin:0 auto;position:relative;z-index:1}
.header-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(59,126,248,0.1);border:0.5px solid rgba(59,126,248,0.3);border-radius:20px;padding:5px 14px;font-size:12px;color:var(--blue);margin-bottom:1rem}
.header-title{font-family:'Syne',sans-serif;font-size:clamp(24px,4vw,36px);font-weight:700;color:var(--text);margin-bottom:.5rem;letter-spacing:-.02em}
.header-title span{color:var(--blue)}
.header-sub{font-size:14px;color:var(--text2);line-height:1.7;max-width:500px;margin:0 auto 1.5rem}

/* PROGRESSION GLOBALE */
.global-prog{max-width:760px;margin:0 auto;padding:1.25rem 1.5rem;border-bottom:0.5px solid var(--border)}
.gp-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.625rem}
.gp-title{font-size:13px;font-weight:500;color:var(--text2)}
.gp-score{font-size:13px;font-weight:600;color:var(--blue)}
.gp-track{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.gp-fill{height:100%;border-radius:3px;background:linear-gradient(to right,var(--blue),var(--teal));transition:width .6s ease}
.gp-pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:.75rem}
.gp-pill{font-size:11px;padding:3px 10px;border-radius:20px;background:var(--surface);border:0.5px solid var(--border2);color:var(--text3)}
.gp-pill.done{background:var(--teal-l);border-color:rgba(15,214,160,.3);color:var(--teal)}

/* PILIERS GRID */
.main{max-width:760px;margin:0 auto;padding:1.5rem}
.piliers-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:2rem}
.pilier-card{background:var(--surface);border:0.5px solid var(--border2);border-radius:var(--r);padding:1.125rem;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.pilier-card:hover{transform:translateY(-2px);border-color:var(--border2)}
.pilier-card.active{border-color:var(--blue);background:var(--bg3)}
.pilier-card.completed{border-color:rgba(15,214,160,.3);background:var(--teal-l)}
.pc-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:.625rem}
.pc-icon{font-size:24px}
.pc-status{font-size:18px}
.pc-num{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);margin-bottom:3px}
.pc-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:3px}
.pc-desc{font-size:11px;color:var(--text2);line-height:1.5}
.pc-prog{height:3px;background:var(--surface2);border-radius:2px;overflow:hidden;margin-top:.75rem}
.pc-fill{height:100%;border-radius:2px;transition:width .4s}

/* DETAIL PILIER */
.pilier-detail{background:var(--surface);border:0.5px solid var(--border2);border-radius:var(--r);padding:1.5rem;margin-bottom:1rem;display:none}
.pilier-detail.show{display:block}
.pd-header{display:flex;align-items:center;gap:12px;margin-bottom:1rem;padding-bottom:1rem;border-bottom:0.5px solid var(--border)}
.pd-icon{font-size:32px}
.pd-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;color:var(--text)}
.pd-subtitle{font-size:12px;color:var(--text2)}
.pd-close{margin-left:auto;width:28px;height:28px;border-radius:50%;background:var(--surface2);border:0.5px solid var(--border2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:var(--text2);flex-shrink:0}
.pd-desc{font-size:14px;color:var(--text2);line-height:1.8;margin-bottom:1.25rem}

/* ACTIVITES */
.activites{display:flex;flex-direction:column;gap:8px;margin-bottom:1.25rem}
.activite{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:var(--rs);border:0.5px solid var(--border2);background:var(--bg3);cursor:pointer;transition:all .15s}
.activite.done{background:var(--teal-l);border-color:rgba(15,214,160,.3)}
.act-check{font-size:16px;flex-shrink:0;margin-top:1px}
.act-content{}
.act-title{font-size:13px;font-weight:500;color:var(--text);margin-bottom:2px}
.act-desc{font-size:12px;color:var(--text2);line-height:1.5}
.activite.done .act-title{color:var(--teal)}
.act-xp{font-size:10px;font-weight:600;padding:2px 6px;border-radius:20px;background:var(--blue-l);color:var(--blue);margin-left:auto;flex-shrink:0;align-self:flex-start;margin-top:2px}

/* QUIZ */
.quiz-zone{background:var(--bg3);border:0.5px solid var(--border2);border-radius:var(--r);padding:1.125rem;margin-bottom:1rem}
.quiz-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:.75rem}
.quiz-q{font-size:13px;color:var(--text2);margin-bottom:.625rem;line-height:1.6}
.quiz-opts{display:flex;flex-direction:column;gap:6px;margin-bottom:.75rem}
.quiz-opt{padding:8px 12px;border-radius:var(--rs);border:0.5px solid var(--border2);background:var(--surface2);font-size:12px;color:var(--text2);cursor:pointer;font-family:inherit;text-align:left;transition:all .15s}
.quiz-opt:hover{border-color:var(--blue);color:var(--text)}
.quiz-opt.sel{border-color:var(--blue);background:var(--blue-l);color:var(--blue)}
.quiz-opt.correct{border-color:var(--teal);background:var(--teal-l);color:var(--teal)}
.quiz-opt.wrong{border-color:var(--red);background:var(--red-l);color:var(--red)}
.quiz-feedback{font-size:12px;line-height:1.6;padding:8px 12px;border-radius:var(--rs);display:none}

/* PILO */
.pilo-box{background:linear-gradient(135deg,var(--bg3),var(--surface));border:0.5px solid var(--border2);border-radius:var(--r);padding:1.125rem;margin-bottom:1rem}
.pilo-hd{display:flex;align-items:center;gap:10px;margin-bottom:.5rem}
.pilo-av{width:28px;height:28px;border-radius:50%;background:var(--blue-l);border:1px solid var(--blue-m);display:flex;align-items:center;justify-content:center;font-size:14px}
.pilo-name{font-size:11px;font-weight:500;color:var(--blue)}
.pilo-msg{font-size:13px;color:var(--text2);line-height:1.7;font-style:italic}

.sec-title{font-size:13px;font-weight:500;color:var(--text2);margin-bottom:.625rem;text-transform:uppercase;letter-spacing:.06em;font-family:'DM Mono',monospace}
.btn-valider{width:100%;padding:12px;border-radius:var(--r);background:var(--blue);color:#fff;font-size:14px;font-weight:500;font-family:inherit;border:none;cursor:pointer;box-shadow:0 6px 20px rgba(59,126,248,.25);transition:opacity .15s;margin-top:.5rem}
.btn-valider:hover{opacity:.9}
.btn-valider:disabled{background:var(--surface2);color:var(--text3);box-shadow:none;cursor:default}
</style>
</head>

// ── ETAT ─────────────────────────────────────────────────
var etat = {};
try { etat = JSON.parse(localStorage.getItem('cap3e_piliers') || '{}'); } catch(e){}

function save() {
  try { localStorage.setItem('cap3e_piliers', JSON.stringify(etat)); } catch(e){}
}

function getProgPilier(pid) {
  var p = PILIERS.find(function(p){return p.id===pid;});
  if(!p) return 0;
  var done = p.activites.filter(function(a){return etat[a.id];}).length;
  return Math.round((done / p.activites.length) * 100);
}

function isPilierComplete(pid) {
  var p = PILIERS.find(function(p){return p.id===pid;});
  if(!p) return false;
  return p.activites.every(function(a){return etat[a.id];});
}

// ── RENDER GRILLE ─────────────────────────────────────────
function renderGrid() {
  var grid = document.getElementById('piliersGrid');
  grid.innerHTML = PILIERS.map(function(p){
    var prog = getProgPilier(p.id);
    var complete = isPilierComplete(p.id);
    var cls = complete ? 'completed' : '';
    var status = complete ? '&#10003;' : (prog > 0 ? '&#9654;' : '&#9675;');
    return '<div class="pilier-card '+cls+'" onclick="showDetail(\''+p.id+'\')" id="card_'+p.id+'">'+
      '<div class="pc-top">'+
      '<span class="pc-icon">'+p.icon+'</span>'+
      '<span class="pc-status" style="color:'+(complete?'var(--teal)':'var(--text3)')+'">'+status+'</span>'+
      '</div>'+
      '<div class="pc-num">Pilier '+p.num+'</div>'+
      '<div class="pc-title">'+p.title+'</div>'+
      '<div class="pc-desc">'+p.desc+'</div>'+
      '<div class="pc-prog"><div class="pc-fill" style="width:'+prog+'%;background:'+p.colorHex+'"></div></div>'+
      '</div>';
  }).join('');

  updateGlobalProg();
  renderPills();
}

function updateGlobalProg() {
  var done = PILIERS.filter(function(p){return isPilierComplete(p.id);}).length;
  var pct = Math.round((done/PILIERS.length)*100);
  document.getElementById('gpScore').textContent = done + ' / ' + PILIERS.length + ' piliers';
  document.getElementById('gpFill').style.width = pct + '%';
}

function renderPills() {
  var pills = document.getElementById('gpPills');
  pills.innerHTML = PILIERS.map(function(p){
    var done = isPilierComplete(p.id);
    return '<span class="gp-pill'+(done?' done':'')+'">'+p.icon+' '+p.title.split(' ')[0]+'</span>';
  }).join('');
}

// ── DETAIL PILIER ─────────────────────────────────────────
var currentPilier = null;

function showDetail(pid) {
  var p = PILIERS.find(function(p){return p.id===pid;});
  if(!p) return;
  currentPilier = p;

  var detail = document.getElementById('pilierDetail');

  var activitesHtml = p.activites.map(function(a){
    var done = etat[a.id];
    return '<div class="activite'+(done?' done':'')+'" onclick="toggleAct(\''+a.id+'\')" id="act_'+a.id+'">'+
      '<span class="act-check">'+(done?'&#10003;':'&#9675;')+'</span>'+
      '<div class="act-content">'+
      '<div class="act-title">'+a.title+'</div>'+
      '<div class="act-desc">'+a.desc+'</div>'+
      '</div>'+
      '<span class="act-xp">+'+a.xp+' XP</span>'+
      '</div>';
  }).join('');

  var quizHtml = '';
  if(p.quiz) {
    var qid = p.id+'_quiz';
    var answered = etat[qid];
    quizHtml = '<div class="quiz-zone">'+
      '<div class="quiz-title">&#128161; Mini-quiz — Teste ta comprehension</div>'+
      '<div class="quiz-q">'+p.quiz.q+'</div>'+
      '<div class="quiz-opts" id="qopts_'+p.id+'">'+
      p.quiz.opts.map(function(o,i){
        var cls = '';
        if(answered!==undefined){
          if(i===answered) cls = o.correct?' correct':' wrong';
          else if(o.correct) cls = ' correct';
        }
        return '<button class="quiz-opt'+cls+'" onclick="answerQuiz(\''+p.id+'\','+i+')" '+(answered!==undefined?'disabled':'')+'>'+o.t+'</button>';
      }).join('')+
      '</div>'+
      '<div class="quiz-feedback" id="qfb_'+p.id+'" style="display:'+(answered!==undefined?'block':'none')+';background:'+(answered!==undefined?(p.quiz.opts[answered].correct?'var(--teal-l)':'var(--red-l)'):'none')+';color:'+(answered!==undefined?(p.quiz.opts[answered].correct?'var(--teal)':'var(--red)'):'inherit')+'">'+
      (answered!==undefined ? p.quiz.opts[answered].feedback : '')+
      '</div>'+
      '</div>';
  }

  detail.innerHTML =
    '<div class="pd-header">'+
    '<span class="pd-icon">'+p.icon+'</span>'+
    '<div><div class="pd-title">'+p.title+'</div><div class="pd-subtitle">Pilier '+p.num+' · '+p.activites.length+' activites</div></div>'+
    '<div class="pd-close" onclick="closeDetail()">&#10005;</div>'+
    '</div>'+
    '<div class="pd-desc">'+p.desc+'</div>'+
    '<div class="pilo-box"><div class="pilo-hd"><div class="pilo-av">&#129302;</div><div class="pilo-name">PILO te dit</div></div><div class="pilo-msg">'+p.pilo+'</div></div>'+
    '<div class="sec-title">Activites</div>'+
    '<div class="activites">'+activitesHtml+'</div>'+
    quizHtml;

  detail.classList.add('show');
  detail.scrollIntoView({behavior:'smooth', block:'start'});

  // Marquer la card active
  document.querySelectorAll('.pilier-card').forEach(function(c){c.classList.remove('active');});
  var card = document.getElementById('card_'+pid);
  if(card) card.classList.add('active');
}

function closeDetail() {
  document.getElementById('pilierDetail').classList.remove('show');
  document.querySelectorAll('.pilier-card').forEach(function(c){c.classList.remove('active');});
  currentPilier = null;
}

function toggleAct(aid) {
  etat[aid] = !etat[aid];
  save();
  if(currentPilier) showDetail(currentPilier.id);
  renderGrid();
}

function answerQuiz(pid, idx) {
  var qid = pid+'_quiz';
  if(etat[qid]!==undefined) return;
  etat[qid] = idx;
  save();
  showDetail(pid);
  renderGrid();
}

// Init
renderGrid();
</script>
