<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Test Firebase</title></head>
<body>
<h2>Test Firebase CAPilot</h2>
<div id="status">Connexion en cours...</div>
<button onclick="testEcriture()">Tester l'ecriture</button>
<div id="result"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
var firebaseConfig = {
  apiKey: "AIzaSyB3lx8FGDKK8ipuHXY7iCJvVNWOzbOD5RU",
  authDomain: "cap3e-capilot.firebaseapp.com",
  databaseURL: "https://cap3e-capilot-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "cap3e-capilot",
  storageBucket: "cap3e-capilot.firebasestorage.app",
  messagingSenderId: "694025738704",
  appId: "1:694025738704:web:0c02175f250140953b81d5"
};

firebase.initializeApp(firebaseConfig);
var db = firebase.database();

db.ref(".info/connected").on("value", function(snap) {
  document.getElementById("status").textContent = snap.val() ? "Connecte a Firebase !" : "Non connecte";
  document.getElementById("status").style.color = snap.val() ? "green" : "red";
});

function testEcriture() {
  db.ref("test/ping").set({
    message: "test",
    timestamp: new Date().toISOString()
  }).then(function() {
    document.getElementById("result").textContent = "SUCCES ! Donnees ecrites dans Firebase.";
    document.getElementById("result").style.color = "green";
  }).catch(function(err) {
    document.getElementById("result").textContent = "ERREUR : " + err.message;
    document.getElementById("result").style.color = "red";
  });
}
</script>
</body>
</html>
